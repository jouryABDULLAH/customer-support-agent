[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-support-agent"
version = "0.1.0"
description = "Grounded customer-support agent over RAGent2 retrieval."
requires-python = ">=3.12"

# Deliberately empty. 
#
#     pip install -e . --no-deps
#
# which registers `customer_support` as importable without touching anything
# already installed.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
